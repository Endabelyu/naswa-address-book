<!DOCTYPE html>

    <header

    >
      <p class="self-center">Create Contact</p>

      <svg

                  stroke="#ffffff"
                  stroke-linecap="round"

                  x2="12"
                  y1="19"
                  y2="5"
                ></line>
                <line
                  fill="none"
                  stroke="#ffffff"
                  stroke-linecap="round"
                  stroke-linejoin="round"

                  x2="19"
                  y1="12"

              </g>
            </g>
          </g>
        </g>
      </svg>

      </div>
      <div class="container-label flex md:flex-col gap-4">

    <main class="h-fit md:ml-[18rem] p-10    "> 
      <h2 class="text-2xl font-semibold mb-10">Create Contact</h2>
     
      <section class="container-data w-10/12 mt-8 relative px-4 overflow-y-auto p-2">
          <form id="contact-form" method="post">
            <div class="container-button  flex flex-col justify-between  rounded-md py-4 ">
              <ul class="flex justify-between">
                <li class="self-center">
              <a href="/" class="bg-primary text-slate-100 rounded-xl py-2 px-4">Cancel</a>
      
                </li>
                <li class="flex gap-4">
                  <!-- <button>favourite</button> -->
                  <button class="bg-primary text-slate-100 rounded-xl py-2 px-4">Save</button>
      
                </li>
            
              </div>
            <div class="overflow-y-auto h-[80dvh]  pt-10 flex flex-col gap-4">
            <div class="container-name flex gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="person" class="w-8 self-start mt-2"><g><path d="M12 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm6 10a1 1 0 0 0 1-1 7 7 0 0 0-14 0 1 1 0 0 0 1 1z" ></path></g></svg>

            <div class="container-input flex flex-col gap-2 w-10/12">  
              <div class="container-select-label">
              </div>            
              <div class="relative py-3 bg-transparent">
              <input type="text" id="firstName" name='firstName' placeholder="" class=" peer block w-full appearance-none  rounded-md py-2 px-2 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent" required
             >
              <label for="firstName" id='firstNameLabel' class="absolute   transition-all duration-200  top-4 left-3 text-gray-400 peer-focus:-top-4 peer-focus:left-0 peer-focus:text-sm peer-focus:text-blue-600 ">First Name</label>
              </div>
            <div class="relative py-3 bg-transparent">
              <input type="text" id="middleName" name='middleName' placeholder=" " class=" peer block w-full appearance-none  rounded-md py-2 px-2 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent" required>
              <label for="middleName" id='middleNameLabel' class="absolute   transition-all duration-200  top-4 left-3 text-gray-400 peer-focus:-top-4 peer-focus:left-0 peer-focus:text-sm peer-focus:text-blue-600 ">Middle Name</label>
          </div>
            <div class="relative py-3 bg-transparent">
              <input type="text" id="lastName" name='lastName' placeholder=" " class=" peer block w-full appearance-none  rounded-md py-2 px-2 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent" required>

          </div>
            
            
          </div>
            </div>
